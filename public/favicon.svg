<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="50%" stop-color="#06090d"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="50%" stop-color="#00f576"/>
      <stop offset="100%" stop-color="#00df89"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f576" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f576" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Light Orbs -->
  <circle cx="256" cy="256" r="140" fill="#00f576" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Screen Frame Outer Shape -->
  <rect x="76" y="96" width="360" height="260" rx="36" fill="#0c141d" stroke="#1f2c38" stroke-width="4"/>
  <rect x="86" y="106" width="340" height="240" rx="28" fill="#05080c" stroke="url(#neonGrad)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- TV Stand Base -->
  <path d="M226 360 L286 360 L298 396 L214 396 Z" fill="#141e28"/>
  <rect x="176" y="396" width="160" height="12" rx="6" fill="#1f2c38" stroke="#00f576" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Mini Header Tag "IPTV" -->
  <text x="256" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle" opacity="0.9">IPTV</text>

  <!-- Central "8K" Monogram with Neon Glow -->
  <g filter="url(#neonGlow)">
    <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="124" font-weight="950" fill="#2BE07A" text-anchor="middle" letter-spacing="2">8K</text>
  </g>

  <!-- Subtitle Nederland badge -->
  <rect x="176" y="304" width="160" height="26" rx="13" fill="#00f576" fill-opacity="0.12" stroke="#00f576" stroke-width="1.5"/>
  <text x="256" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#00f576" text-anchor="middle" letter-spacing="4">NEDERLAND</text>

  <!-- Live Pulse Dot -->
  <circle cx="396" cy="132" r="6" fill="#00f576" filter="url(#neonGlow)"/>
</svg>