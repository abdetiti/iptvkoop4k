<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <defs>
    <linearGradient id="hNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="50%" stop-color="#00f576"/>
      <stop offset="100%" stop-color="#00df89"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Symbol on Left (80x80) -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="20" fill="#0a1017" stroke="#00f576" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="8" y="12" width="64" height="48" rx="8" fill="#04070a" stroke="#1f2c38" stroke-width="1.5"/>
    <text x="40" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="950" fill="#2BE07A" text-anchor="middle" >8K</text>
    <circle cx="62" cy="18" r="2.5" fill="#00f576"/>
    <!-- Stand -->
    <path d="M34 60 L46 60 L48 68 L32 68 Z" fill="#141e28"/>
    <rect x="26" y="68" width="28" height="3" rx="1.5" fill="#00f576" fill-opacity="0.8"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(108, 0)">
    <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="0.5">IPTV</text>
    <text x="96" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="950" fill="#2BE07A"  letter-spacing="1">8K</text>
    <text x="2" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="5">NEDERLAND</text>
    <circle cx="166" cy="46" r="3.5" fill="#00f576" filter="url(#hGlow)"/>
  </g>
</svg>